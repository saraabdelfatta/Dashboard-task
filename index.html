//this is the entry point for the app. 
//It is a simple HTML file that loads the React app. 
//The React app is loaded from the src/main.jsx file. 
//The root div is where the React app will be rendered. 
//The script tag loads the main.jsx file as a module.
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport tag is what makes the phone layout work -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UMG Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
